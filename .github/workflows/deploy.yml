name: Deploy Application

on:
    workflow_call:
        inputs:
            docker_image:
                description: "Docker image to deploy"
                required: true
                type: string
            service_name:
                description: "Service name (e.g., backend, frontend)"
                required: true
                type: string
        secrets:
            SERVER_HOST:
                description: "The server host address"
                required: true
            SERVER_USER:
                description: "The server user name"
                required: true
jobs:
    Deploy:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6.0.1
              with:
                  repository: hanatole/calculator-deployment
                  ref: main

            - name: Update inventory file
              run: |
                  sed -i "s/SERVER_HOST/${{ secrets.SERVER_HOST }}/g" inventory.yml
                  sed -i "s/SERVER_USER/${{ secrets.SERVER_USER }}/g" inventory.yml
                  echo "$(< inventory.yml)"
