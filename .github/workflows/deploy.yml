name: Deploy Application

on:
    workflow_call:
        inputs:
            docker_image:
                description: "Docker image to deploy"
                required: true
                type: string
            service_name:
                description: "Service name (e.g., backend, frontend)"
                required: true
                type: string
        secrets:
            SERVER_HOST:
                description: "The server host address"
                required: true
            SERVER_USER:
                description: "The server user name"
                required: true
            SSH_PRIVATE_KEY:
                description: "SSH private key for server access"
                required: true
jobs:
    Deploy:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6.0.1
              with:
                  repository: hanatole/calculator-deployment
                  ref: main

            - name: Update inventory file
              run: |
                  sed -i "s/SERVER_HOST/${{ secrets.SERVER_HOST }}/g" inventory.yml
                  sed -i "s/SERVER_USER/${{ secrets.SERVER_USER }}/g" inventory.yml
                  eval $(ssh-agent -s)
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
                  mkdir -p ~/.ssh && chmod 700 ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/private_key
                  chmod 600 ~/.ssh/private_key
                  ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
                  chmod 644 ~/.ssh/known_hosts

            - name: Install Ansible and Docker dependencies
              run: |
                  python -m pip install ansible
                  echo "$(<.ssh/private_key)"
